  </defs>
  <style>
    .serif { font-family: 'Tiempos Headline', Georgia, 'Times New Roman', serif; }
    .sans  { font-family: 'Styrene A', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono  { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    /* 1. intro: the logo drops in from the top (0-1.7s), holds, then splits in two (2.8-4.4s) */
    .lg-a { animation: split-a 5s both; }
    .lg-b { animation: split-b 5s both; }
    .lg-a use, .lg-b use { animation: tint 5s both; }
    @keyframes split-a {
      0%   { transform: translate(450px, -420px) scale(1.66); animation-timing-function: cubic-bezier(.5,0,1,.6) }
      18%  { transform: translate(450px, 334px) scale(1.66);  animation-timing-function: ease-out }
      26%  { transform: translate(450px, 280px) scale(1.66);  animation-timing-function: ease-in }
      34%  { transform: translate(450px, 334px) scale(1.66) }
      56%  { transform: translate(450px, 334px) scale(1.66);  animation-timing-function: cubic-bezier(.65,0,.35,1) }
      88%, 100% { transform: translate(-333px, -368px) scale(5.525) }
    }
    @keyframes split-b {
      0%   { transform: translate(450px, -420px) scale(1.66); animation-timing-function: cubic-bezier(.5,0,1,.6) }
      18%  { transform: translate(450px, 334px) scale(1.66);  animation-timing-function: ease-out }
      26%  { transform: translate(450px, 280px) scale(1.66);  animation-timing-function: ease-in }
      34%  { transform: translate(450px, 334px) scale(1.66) }
      56%  { transform: translate(450px, 334px) scale(1.66);  animation-timing-function: cubic-bezier(.65,0,.35,1) }
      88%, 100% { transform: translate(533px, 1020px) scale(5.525) }
    }
    @keyframes tint { 0%, 56% { fill: #F1EFE8 } 88%, 100% { fill: #1E1E1D } }
    .brand { transform-box: fill-box; transform-origin: 50% 50%; animation: brand 5s both; }
    @keyframes brand {
      0%, 20% { opacity: 0; transform: scale(1.9) }
      26%  { opacity: 1; transform: scale(1.9) }
      36%  { opacity: 1; transform: scale(1) }
      52%  { opacity: 1; transform: scale(1) }
      60%, 100% { opacity: 0; transform: scale(1) }
    }

    /* 2. then the information appears, section by section */
    .info { animation: show .9s ease-out both; }
    .i1 { animation-delay: 4.3s } .i2 { animation-delay: 4.7s } .i3 { animation-delay: 5.1s } .i4 { animation-delay: 5.5s }
    @keyframes show { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: translateY(0) } }

    /* 3. idle motion */
    .float { animation: drift 11s ease-in-out 5s infinite alternate; }
    .float.b { animation-name: drift2; animation-duration: 14s; }
    @keyframes drift  { from { transform: translate(0, 0) } to { transform: translate(-16px, 22px) } }
    @keyframes drift2 { from { transform: translate(0, 0) } to { transform: translate(16px, -22px) } }
    .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 2.4s ease-in-out infinite; }
    @keyframes flicker {
      0%, 100% { transform: scale(1, 1) skewX(0deg); stroke-opacity: 1 }
      25% { transform: scale(1.03, 1.06) skewX(-2deg); stroke-opacity: .85 }
      50% { transform: scale(.98, 1.02) skewX(1.5deg); stroke-opacity: 1 }
      75% { transform: scale(1.02, 1.05) skewX(-1deg); stroke-opacity: .9 }
    }
    .spark { opacity: 0; animation: rise 3s ease-out infinite; }
    .spark.s2 { animation-delay: 1.4s; }
    @keyframes rise { 0% { opacity: 0; transform: translateY(6px) } 25% { opacity: .9 } 100% { opacity: 0; transform: translateY(-16px) } }
    @media (prefers-reduced-motion: reduce) {
      .lg-a, .lg-b, .lg-a use, .lg-b use, .info, .float, .flame, .spark { animation: none }
      .brand { display: none }
    }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="1757" fill="#0E0E0E"/>

    <g class="float a"><g class="lg-a" transform="translate(-333 -368) scale(5.525)" filter="url(#smooth)"><use href="#lg" fill="#1E1E1D"/></g></g>
    <g class="float b"><g class="lg-b" transform="translate(533 1020) scale(5.525)" filter="url(#smooth)"><use href="#lg" fill="#1E1E1D"/></g></g>
    <text class="brand mono" x="600" y="756" font-size="26" letter-spacing="9" text-anchor="middle" fill="#F1EFE8">RESHAPE LAB</text>

    <g class="info i1">
      <line x1="100" y1="420" x2="1100" y2="420" stroke="#33332F" stroke-width="2"/>
      <text class="mono" font-size="19" letter-spacing="4.5" fill="#8B8983" x="100" y="120">RESHAPE LAB</text>
      <text class="serif" font-size="110" fill="#F1EFE8" x="94" y="262">QUAD-UAV</text>
      <text class="sans" font-size="30" fill="#F1EFE8" x="100" y="340">Quadcopter firmware:</text>
      <text class="sans" font-size="30" fill="#F1EFE8" x="100" y="384">ESP32 flight link and STM32F103C8 PID.</text>
    </g>
    <g class="info i2">
      <text class="serif" font-size="72" fill="#F1EFE8" x="96" y="516">FIRMWARE</text>
      <text class="mono" font-size="19" letter-spacing="4.5" fill="#8B8983" x="100" y="600">ESP32  &#183;  esp32_drone</text>
      <text class="sans" font-size="30" fill="#F1EFE8" x="100" y="641">IMU, GPS, RC in, DShot out, telemetry, web dashboard</text>
      <text class="mono" font-size="19" fill="#77756E" x="100" y="675">main_esp32.cpp</text>
      <text class="mono" font-size="19" letter-spacing="4.5" fill="#8B8983" x="100" y="740">STM32F103C8  &#183;  stm32_drone</text>
      <text class="sans" font-size="30" fill="#F1EFE8" x="100" y="781">Cascade PID and motor mixing</text>
      <text class="mono" font-size="19" fill="#77756E" x="100" y="815">main_stm32f103c8t6.cpp  &#183;  Flight.cpp  &#183;  Motor.cpp</text>
      <line x1="100" y1="870" x2="1100" y2="870" stroke="#33332F" stroke-width="2"/>
    </g>
    <g class="info i3">
      <text class="serif" font-size="72" fill="#F1EFE8" x="96" y="966">DATA LINKS</text>
      <text class="mono" font-size="19" letter-spacing="4.5" fill="#8B8983" x="100" y="1050">ESP-NOW  /  NRF24</text>
      <text class="sans" font-size="30" fill="#F1EFE8" x="100" y="1091">Receives RC from the handheld, sends telemetry back</text>
      <text class="mono" font-size="19" fill="#77756E" x="100" y="1125">RF_RX.cpp</text>
      <text class="mono" font-size="19" letter-spacing="4.5" fill="#8B8983" x="100" y="1190">UART</text>
      <text class="sans" font-size="30" fill="#F1EFE8" x="100" y="1231">ESP32 to STM32: RC down, MotorMix up</text>
      <text class="mono" font-size="19" fill="#77756E" x="100" y="1265">UART.cpp</text>
      <line x1="100" y1="1320" x2="1100" y2="1320" stroke="#33332F" stroke-width="2"/>
    </g>
    <g class="info i4">
      <text class="serif" font-size="72" fill="#F1EFE8" x="96" y="1416">RELATED REPOS</text>
      <text class="mono" font-size="19" letter-spacing="4.5" fill="#8B8983" x="100" y="1500">JS-CONTROLER</text>
      <text class="sans" font-size="30" fill="#F1EFE8" x="100" y="1541">Handheld controller. src/RF_Protocol.h is shared, keep both in sync</text>
      <text class="mono" font-size="19" letter-spacing="4.5" fill="#8B8983" x="100" y="1606">GCS-STATION</text>
      <text class="sans" font-size="30" fill="#F1EFE8" x="100" y="1647">Ground station and flight simulator</text>
    </g>
  </g>
